[project]
name = "jaconv-domino"
dynamic = ["version"]
description = "Conversion between Japanese kana and pydomino phonemes, with jaconv functions re-exported"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "japanese",
  "converter",
  "hiragana",
  "katakana",
  "phoneme",
  "domino",
  "lyrics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Japanese",
]
dependencies = ["jaconv>=0.5.0,<0.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[project.urls]
Homepage = "https://github.com/h21465/jaconv-domino"
Repository = "https://github.com/h21465/jaconv-domino"
Documentation = "https://github.com/h21465/jaconv-domino#readme"
Issues = "https://github.com/h21465/jaconv-domino/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jaconv_domino/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jaconv_domino"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "T201",   # print found
  "D400",   # First line should end with a period
  "D415",   # First line should end with punctuation
  "INP001", # Implicit namespace package
  "ERA001", # Commented-out code
  "FBT001", # Boolean positional argument: kept for API compatibility
  "FBT002", # Boolean default positional argument: kept for API compatibility
  "COM812", # Conflicts with the ruff formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests", "jaconv_domino"]
addopts = "--doctest-modules"
pythonpath = ["tests"]
